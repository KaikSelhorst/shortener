# Rename 'shortener-web' to your chosen app name (must be unique on fly.io)
app = 'shortener-web'
primary_region = 'gru'

[build]

[env]
  ORIGIN = 'https://shortener-web.fly.dev'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
