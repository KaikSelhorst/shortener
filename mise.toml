[tools]
bun = "1.3.14"
go = "1.26.2"
golangci-lint = "2.11.4"

[env]
_.file = "api/.env"

# ── API ──────────────────────────────────────────────────────────────────────

[tasks.dev]
description = "Run the API dev server"
run = "go run cmd/server/main.go"
dir = "api"

[tasks.seed]
description = "Seed the database"
run = "go run ./cmd/seed"
dir = "api"

[tasks.fmt]
description = "Format Go code"
run = "gofmt -w ."
dir = "api"

[tasks.lint]
description = "Lint Go code"
run = "golangci-lint run ./..."
dir = "api"

[tasks.test]
description = "Run unit tests"
run = "go test ./internal/service/... ./internal/handler/..."
dir = "api"

[tasks.test-integration]
description = "Run integration tests"
run = "go test -tags integration ./internal/repository/..."
dir = "api"

# ── Web ──────────────────────────────────────────────────────────────────────

[tasks.web-dev]
description = "Run the web dev server"
run = "bun dev"
dir = "web"

[tasks.web-build]
description = "Build the web app"
run = "bun run build"
dir = "web"

[tasks.web-check]
description = "Type check the web app"
run = "bun run check"
dir = "web"

[tasks.web-lint]
description = "Lint the web app"
run = "bun run lint"
dir = "web"

[tasks.web-fmt]
description = "Format web code"
run = "bun run format"
dir = "web"

# ── Docker ───────────────────────────────────────────────────────────────────

[tasks.docker-up]
description = "Start Docker services"
run = "docker compose up -d"

[tasks.docker-down]
description = "Stop Docker services"
run = "docker compose down"
